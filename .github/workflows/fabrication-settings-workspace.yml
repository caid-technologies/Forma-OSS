name: Fabrication settings workspace
on:
  push:
    branches: [feat/user-fabrication-settings]
    paths: [.github/workflows/fabrication-settings-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o forma-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fabrication-settings-source
          path: forma-source.zip
          retention-days: 1
