name: Commit validated generation mode routing

on:
  push:
    branches:
      - feature/511-cost-aware-hierarchical-generation
    paths:
      - ".github/workflows/temp-generation-mode-source-commit.yml"

permissions:
  contents: write

jobs:
  commit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply the already validated patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path(".github/workflows/temp-generation-mode-routing.yml")
          text = helper.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in text:
              raise SystemExit("Could not locate patch script in validation helper.")
          script = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), str(helper), "exec"), {"__name__": "__main__"})
          PY

          # The validated patch intentionally touched workflow files only for CI coverage
          # and self-cleanup. Restore those here; source/test changes are committed below.
          git restore .github/workflows/cost-aware-generation.yml
          git restore .github/workflows/temp-generation-mode-routing.yml

      - name: Commit source routing changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            forma_core/workspaces/projects/models.py \
            forma_core/workspaces/context/models.py \
            forma_core/workers/generation.py \
            forma_core/database.py \
            apps/api/a2a.py \
            apps/api/main.py \
            apps/api/context_builds.py \
            apps/api/context_gathering_api.py \
            apps/web/app/forma-workspace.tsx \
            apps/web/app/forma-workspace/home-chat-view.tsx \
            tests/projects/test_generation_mode_requests.py
          git diff --cached --check
          git commit -m "feat: route regular and progressive generation modes"
          git push origin HEAD:${GITHUB_REF_NAME}
