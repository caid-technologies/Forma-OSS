name: Professional CAD export
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'forma_core/cad_export/**'
      - 'forma_core/cli/main.py'
      - 'tests/integrations/test_cad_export.py'
      - '.github/workflows/professional-cad-export.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.integrations.test_cad_export tests.tooling.test_core_cli -v
