name: Integrate chat project UI (temporary PR 500 helper)

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-chat-project-layout.yml
      - scripts/apply-chat-project-layout.py
      - apps/web/app/forma-workspace/chat-project-layout.tsx

permissions:
  contents: read

jobs:
  integrate:
    if: github.event.pull_request.number == 500 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/chat-project-workspace'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply the blob-guarded source changes
        run: |
          python scripts/apply-chat-project-layout.py
          git diff --check
      - name: Commit only the two integrated chat components
        run: |
          git add apps/web/app/forma-workspace.tsx apps/web/app/forma-workspace/home-chat-view.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(web): wire the shared project pane into both chat views'
            git push origin HEAD:refs/heads/feat/chat-project-workspace
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: chat-workspace-integrated-source
          path: |
            apps/web/app/forma-workspace.tsx
            apps/web/app/forma-workspace/home-chat-view.tsx
          retention-days: 1
