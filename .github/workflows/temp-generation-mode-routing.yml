name: Wire generation mode routing

on:
  push:
    branches:
      - feature/511-cost-aware-hierarchical-generation
    paths:
      - ".github/workflows/temp-generation-mode-routing.yml"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Regular / Progressive routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          # Public request model: explicit, validated strategy with Regular as the safe default.
          replace(
              "forma_core/workspaces/projects/models.py",
              '''    generate_image: bool = Field(\n        False,\n        description="When true, generate a product concept image with the configured image provider"\n    )\n    provider: Optional[str] = Field(\n''',
              '''    generate_image: bool = Field(\n        False,\n        description="When true, generate a product concept image with the configured image provider"\n    )\n    generation_mode: str = Field(\n        "regular",\n        description="Generation strategy: regular one-shot or progressive hierarchical generation.",\n    )\n    provider: Optional[str] = Field(\n''',
          )
          replace(
              "forma_core/workspaces/projects/models.py",
              '''    @field_validator("provider", "model", "project_id", "retry_stage", "chat_id", "source_project_id", "client_job_id", "external_source_provider", mode="before")\n''',
              '''    @field_validator("generation_mode", mode="before")\n    @classmethod\n    def normalize_generation_mode(cls, value: Any) -> str:\n        normalized = str(value or "regular").strip().lower()\n        if normalized not in {"regular", "progressive"}:\n            raise ValueError("generation_mode must be regular or progressive.")\n        return normalized\n\n    @field_validator("provider", "model", "project_id", "retry_stage", "chat_id", "source_project_id", "client_job_id", "external_source_provider", mode="before")\n''',
          )

          # Context-gathering path carries the selected strategy into its durable build plan.
          replace(
              "forma_core/workspaces/context/models.py",
              '''    conversation_id: NonEmptyString\n    text: str = ""\n    attachments: list[ContextAttachment] = Field(default_factory=list)\n''',
              '''    conversation_id: NonEmptyString\n    text: str = ""\n    generation_mode: Literal["regular", "progressive"] = "regular"\n    attachments: list[ContextAttachment] = Field(default_factory=list)\n''',
          )
          replace(
              "apps/api/context_gathering_api.py",
              '''                build_execution, workflow = build_dispatcher.start(\n                    str(project_id),\n                    owner,\n                    request.conversation_id,\n                )\n''',
              '''                build_execution, workflow = build_dispatcher.start(\n                    str(project_id),\n                    owner,\n                    request.conversation_id,\n                    generation_mode=request.generation_mode,\n                )\n''',
          )
          replace(
              "apps/api/context_builds.py",
              '''    def start(\n        self,\n        project_id: str,\n        owner_user_id: str,\n        conversation_id: str,\n    ) -> tuple[ContextBuildExecution, ProjectWorkflow]:\n''',
              '''    def start(\n        self,\n        project_id: str,\n        owner_user_id: str,\n        conversation_id: str,\n        *,\n        generation_mode: str = "regular",\n    ) -> tuple[ContextBuildExecution, ProjectWorkflow]:\n''',
          )
          replace(
              "apps/api/context_builds.py",
              '''        plan = create_project_generation_plan(outcome.build, owner_user_id)\n''',
              '''        plan = create_project_generation_plan(\n            outcome.build,\n            owner_user_id,\n            generation_mode=generation_mode,\n        )\n''',
          )

          # Durable worker plans persist the chosen mode. Progressive pauses for visual review.
          replace(
              "forma_core/database.py",
              '''def create_project_generation_plan(\n    build: ProjectBuild,\n    owner_user_id: str,\n    *,\n    provider_name: Optional[str] = None,\n    model_name: Optional[str] = None,\n):\n''',
              '''def create_project_generation_plan(\n    build: ProjectBuild,\n    owner_user_id: str,\n    *,\n    provider_name: Optional[str] = None,\n    model_name: Optional[str] = None,\n    generation_mode: str = "regular",\n):\n''',
          )
          replace(
              "forma_core/database.py",
              '''    from forma_core.workers import (\n        GENERATION_CAPABILITY_ID,\n        GENERATION_INPUT_VERSION,\n        GENERATION_WORKER_ID,\n        WORKER_CONTRACT_VERSION,\n        GenerationWorker,\n        HardwareIRGenerationEngine,\n        WorkerOrchestrator,\n        WorkerRequest,\n    )\n\n    owner = _normalize_user_id(owner_user_id)\n''',
              '''    from forma_core.workers import (\n        GENERATION_CAPABILITY_ID,\n        GENERATION_INPUT_VERSION,\n        GENERATION_WORKER_ID,\n        WORKER_CONTRACT_VERSION,\n        GenerationWorker,\n        HardwareIRGenerationEngine,\n        WorkerOrchestrator,\n        WorkerRequest,\n    )\n    from forma_core.workspaces.projects.generation_mode import GenerationMode\n\n    try:\n        normalized_generation_mode = GenerationMode(str(generation_mode or "regular").strip().lower())\n    except ValueError as exc:\n        raise ValueError("generation_mode must be regular or progressive.") from exc\n\n    owner = _normalize_user_id(owner_user_id)\n''',
          )
          replace(
              "forma_core/database.py",
              '''        metadata={"build_id": str(build.build_id), "cad_required": False},\n''',
              '''        metadata={\n            "build_id": str(build.build_id),\n            "cad_required": False,\n            "generation_mode": normalized_generation_mode.value,\n            **(\n                {"visual_approval_policy": "require_approval"}\n                if normalized_generation_mode == GenerationMode.PROGRESSIVE\n                else {}\n            ),\n        },\n''',
          )

          # The worker must forward persisted mode metadata to the structured pipeline.
          replace(
              "forma_core/workers/generation.py",
              '''                            generation_metadata={\n                                "prior_generation_run": prior_generation_run,\n                                "retry_stage": retry_stage,\n                                "stage_checkpoint": record_stage_checkpoint,\n                            },\n''',
              '''                            generation_metadata={\n                                "prior_generation_run": prior_generation_run,\n                                "retry_stage": retry_stage,\n                                "stage_checkpoint": record_stage_checkpoint,\n                                "generation_mode": request.metadata.get("generation_mode", "regular"),\n                                "visual_approval_policy": request.metadata.get("visual_approval_policy"),\n                                "cad_required": bool(request.metadata.get("cad_required", False)),\n                            },\n''',
          )

          # Hosted /generate and A2A/MCP support the same explicit contract.
          replace(
              "apps/api/a2a.py",
              '''from forma_core.workspaces.projects.cad_generation import ensure_native_cad_model\n''',
              '''from forma_core.workspaces.projects.cad_generation import ensure_native_cad_model\nfrom forma_core.workspaces.projects.generation_mode import GenerationMode\nfrom forma_core.workspaces.projects.output import attach_product_image as attach_project_product_image\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''    project_id: Optional[str] = None,\n    retry_stage: Optional[str] = None,\n    settings: Optional[ResolvedIntegrationSettings] = None,\n) -> Dict[str, Any]:\n''',
              '''    project_id: Optional[str] = None,\n    retry_stage: Optional[str] = None,\n    generation_mode: str = "regular",\n    settings: Optional[ResolvedIntegrationSettings] = None,\n) -> Dict[str, Any]:\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''    workflow_id = normalize_workflow_id(workflow)\n    normalized_retry_stage = str(retry_stage or "").strip() or None\n''',
              '''    workflow_id = normalize_workflow_id(workflow)\n    try:\n        normalized_generation_mode = GenerationMode(str(generation_mode or "regular").strip().lower())\n    except ValueError as exc:\n        raise ValueError("generation_mode must be regular or progressive.") from exc\n    progressive_generation = normalized_generation_mode == GenerationMode.PROGRESSIVE\n    if progressive_generation:\n        # Progressive generation requires the visual artifact used by its review gate.\n        generate_image = True\n    normalized_retry_stage = str(retry_stage or "").strip() or None\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''        "generate_image": generate_image,\n        "frontend_job_id": frontend_job_id,\n''',
              '''        "generate_image": generate_image,\n        "generation_mode": normalized_generation_mode.value,\n        "frontend_job_id": frontend_job_id,\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''                    "cad_required": cad_required,\n                },\n''',
              '''                    "cad_required": cad_required,\n                    "generation_mode": normalized_generation_mode.value,\n                    **(\n                        {"visual_approval_policy": "require_approval"}\n                        if progressive_generation\n                        else {}\n                    ),\n                },\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''                "workflow": workflow_id,\n                "external_source_provider": external_source_provider or (ir.assembly_metadata or {}).get("external_source_provider"),\n''',
              '''                "workflow": workflow_id,\n                "generation_mode": normalized_generation_mode.value,\n                "external_source_provider": external_source_provider or (ir.assembly_metadata or {}).get("external_source_provider"),\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''            _attach_product_image(prompt_text, ir, generate_image=generate_image, settings=settings)\n''',
              '''            if progressive_generation:\n                attach_project_product_image(\n                    prompt_text,\n                    ir,\n                    generate_image=generate_image,\n                    settings=settings,\n                )\n            else:\n                _attach_product_image(prompt_text, ir, generate_image=generate_image, settings=settings)\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''            payload.get("project_id"),\n            payload.get("retry_stage"),\n            settings=settings,\n''',
              '''            payload.get("project_id"),\n            payload.get("retry_stage"),\n            generation_mode=payload.get("generation_mode", "regular"),\n            settings=settings,\n''',
          )
          replace(
              "apps/api/a2a.py",
              '''                    "generate_image": {"type": "boolean", "default": False},\n                    "external_source_provider": {\n''',
              '''                    "generate_image": {"type": "boolean", "default": False},\n                    "generation_mode": {\n                        "type": "string",\n                        "enum": ["regular", "progressive"],\n                        "default": "regular",\n                        "description": "Regular runs one-shot generation; progressive uses the staged hierarchical lifecycle.",\n                    },\n                    "external_source_provider": {\n''',
          )

          # HTTP endpoint records mode on the job and forwards it to the generation adapter.
          replace(
              "apps/api/main.py",
              '''        "image_data": request.image_data,\n        "generate_image": request.generate_image,\n        "provider": request.provider,\n''',
              '''        "image_data": request.image_data,\n        "generate_image": request.generate_image or request.generation_mode == "progressive",\n        "generation_mode": request.generation_mode,\n        "provider": request.provider,\n''',
          )
          replace(
              "apps/api/main.py",
              '''                generate_image=request.generate_image,\n                workflow=request.workflow,\n''',
              '''                generate_image=request.generate_image or request.generation_mode == "progressive",\n                generation_mode=request.generation_mode,\n                workflow=request.workflow,\n''',
          )

          # UI: Regular is default and uses the existing direct one-shot handler;
          # Progressive keeps context gathering + durable worker execution.
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''import HomeChatView from "./forma-workspace/home-chat-view";\n''',
              '''import HomeChatView, { type GenerationMode } from "./forma-workspace/home-chat-view";\n''',
          )
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''  const [generateProductImage, setGenerateProductImage] = useState(false);\n  const [generationWorkflow, setGenerationWorkflow] = useState(DEFAULT_WORKFLOW_ID);\n''',
              '''  const [generateProductImage, setGenerateProductImage] = useState(false);\n  const [generationMode, setGenerationMode] = useState<GenerationMode>("regular");\n  const [generationWorkflow, setGenerationWorkflow] = useState(DEFAULT_WORKFLOW_ID);\n''',
          )
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''          conversation_id: requestChatId,\n          requested_tool: "build_project",\n''',
              '''          conversation_id: requestChatId,\n          generation_mode: generationMode,\n          requested_tool: "build_project",\n''',
          )
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''          conversation_id: requestChatId,\n          text,\n          attachments: imageData ? [{\n''',
              '''          conversation_id: requestChatId,\n          text,\n          generation_mode: generationMode,\n          attachments: imageData ? [{\n''',
          )
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''    if (!contextCheckpoint) {\n      setGenerationInputNotice(null);\n      try {\n        const clarification = await requestHumanContextQuestions(\n''',
              '''    if (!contextCheckpoint && generationMode !== "regular") {\n      setGenerationInputNotice(null);\n      try {\n        const clarification = await requestHumanContextQuestions(\n''',
          )
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''          image_data: imageData || null,\n          generate_image: generateProductImage,\n''',
              '''          image_data: imageData || null,\n          generate_image: generateProductImage,\n          generation_mode: generationMode,\n''',
          )
          replace(
              "apps/web/app/forma-workspace.tsx",
              '''              onSubmit={handleGatherContext}\n              canBuildNow={hostedChatEnabled && (() => {\n''',
              '''              generationMode={generationMode}\n              onGenerationModeChange={setGenerationMode}\n              onSubmit={authoringMode ? handleGatherContext : generationMode === "regular" ? handleGenerate : handleGatherContext}\n              canBuildNow={generationMode === "progressive" && hostedChatEnabled && (() => {\n''',
          )

          # Mode control in the chat composer; do not call the old flow "Legacy" in UX.
          replace(
              "apps/web/app/forma-workspace/home-chat-view.tsx",
              '''type HomeChatViewProps = {\n''',
              '''export type GenerationMode = "regular" | "progressive";\n\ntype HomeChatViewProps = {\n''',
          )
          replace(
              "apps/web/app/forma-workspace/home-chat-view.tsx",
              '''  onSelectExample: (example: string) => void;\n  onSubmit: FormEventHandler<HTMLFormElement>;\n''',
              '''  onSelectExample: (example: string) => void;\n  generationMode: GenerationMode;\n  onGenerationModeChange: (mode: GenerationMode) => void;\n  onSubmit: FormEventHandler<HTMLFormElement>;\n''',
          )
          replace(
              "apps/web/app/forma-workspace/home-chat-view.tsx",
              '''  examples,\n  onSelectExample,\n  onSubmit,\n''',
              '''  examples,\n  onSelectExample,\n  generationMode,\n  onGenerationModeChange,\n  onSubmit,\n''',
          )
          replace(
              "apps/web/app/forma-workspace/home-chat-view.tsx",
              '''      : inputValid\n        ? "Send context"\n        : "Check hardware idea";\n''',
              '''      : inputValid\n        ? generationMode === "regular" ? "Generate project" : "Send context"\n        : "Check hardware idea";\n''',
          )
          replace(
              "apps/web/app/forma-workspace/home-chat-view.tsx",
              '''            <div className="mt-1 flex items-center justify-between gap-2">\n              <button\n                type="button"\n                onClick={() => imageInputRef.current?.click()}\n                className="inline-flex h-7 w-7 items-center justify-center rounded-md text-zinc-400 transition-colors hover:bg-zinc-800/50 hover:text-zinc-200"\n                aria-label="Attach image"\n                title="Attach an image or paste one from your clipboard"\n              >\n                <Paperclip className="h-4 w-4" />\n              </button>\n              <div className="flex items-center gap-1.5">\n''',
              '''            <div className="mt-1 flex items-center justify-between gap-2">\n              <div className="flex min-w-0 items-center gap-2">\n                <button\n                  type="button"\n                  onClick={() => imageInputRef.current?.click()}\n                  className="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-zinc-400 transition-colors hover:bg-zinc-800/50 hover:text-zinc-200"\n                  aria-label="Attach image"\n                  title="Attach an image or paste one from your clipboard"\n                >\n                  <Paperclip className="h-4 w-4" />\n                </button>\n                {!authoringActive && (\n                  <label className="inline-flex min-w-0 items-center rounded-md border border-white/5 bg-zinc-900/60 px-1.5 text-[11px] text-zinc-400">\n                    <span className="sr-only">Generation mode</span>\n                    <select\n                      value={generationMode}\n                      onChange={(event) => onGenerationModeChange(event.target.value as GenerationMode)}\n                      disabled={generationActive || isLoading}\n                      className="h-6 max-w-[8rem] cursor-pointer bg-transparent pr-1 text-[11px] font-medium text-zinc-300 outline-none disabled:cursor-not-allowed disabled:opacity-60"\n                      title={generationMode === "regular"\n                        ? "Regular: one-shot generation"\n                        : "Progressive: staged generation with concept review before CAD"}\n                    >\n                      <option value="regular">Regular</option>\n                      <option value="progressive">Progressive</option>\n                    </select>\n                  </label>\n                )}\n              </div>\n              <div className="flex items-center gap-1.5">\n''',
          )

          # Focused request-contract tests.
          Path("tests/projects/test_generation_mode_requests.py").write_text('''from __future__ import annotations\n\nimport pytest\nfrom pydantic import ValidationError\n\nfrom forma_core.workspaces.context.models import ContextGatheringRequest\nfrom forma_core.workspaces.projects.generation_mode import (\n    GenerationMode,\n    get_generation_mode,\n    is_progressive_generation,\n)\nfrom forma_core.workspaces.projects.models import GenerateProjectRequest\n\n\ndef test_regular_is_the_default_for_generation_requests() -> None:\n    request = GenerateProjectRequest(prompt="Build a motor bracket")\n    assert request.generation_mode == "regular"\n    assert get_generation_mode({"design_brief_id": "brief", "visual_approval_policy": "require_approval"}) == GenerationMode.REGULAR\n    assert not is_progressive_generation({"design_brief_id": "brief"})\n\n\ndef test_progressive_mode_is_explicit_on_both_request_surfaces() -> None:\n    direct = GenerateProjectRequest(prompt="Build a motor bracket", generation_mode=" Progressive ")\n    context = ContextGatheringRequest(\n        conversation_id="chat-1",\n        text="Build a motor bracket",\n        generation_mode="progressive",\n    )\n    assert direct.generation_mode == "progressive"\n    assert context.generation_mode == "progressive"\n    assert is_progressive_generation({"generation_mode": direct.generation_mode})\n\n\ndef test_unknown_generation_mode_is_rejected_at_the_api_contract() -> None:\n    with pytest.raises(ValidationError):\n        GenerateProjectRequest(prompt="Build a motor bracket", generation_mode="legacy-ish")\n''', encoding="utf-8")

          # Keep the focused lifecycle CI aware of the routing surfaces and tests.
          replace(
              ".github/workflows/cost-aware-generation.yml",
              '''      - "forma_core/workspaces/projects/output.py"\n      - "tests/agents/test_cost_aware_pipeline.py"\n''',
              '''      - "forma_core/workspaces/projects/output.py"\n      - "forma_core/workspaces/projects/models.py"\n      - "forma_core/workspaces/context/models.py"\n      - "forma_core/workers/generation.py"\n      - "forma_core/database.py"\n      - "apps/api/a2a.py"\n      - "apps/api/main.py"\n      - "apps/api/context_builds.py"\n      - "apps/api/context_gathering_api.py"\n      - "apps/web/app/forma-workspace.tsx"\n      - "apps/web/app/forma-workspace/home-chat-view.tsx"\n      - "tests/agents/test_cost_aware_pipeline.py"\n''',
          )
          replace(
              ".github/workflows/cost-aware-generation.yml",
              '''          tests/projects/test_hierarchical_visuals.py\n''',
              '''          tests/projects/test_hierarchical_visuals.py\n          tests/projects/test_generation_mode_requests.py\n''',
          )

          # The helper workflow removes itself from the final branch state.
          Path(".github/workflows/temp-generation-mode-routing.yml").unlink()
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt pytest

      - name: Run focused generation-mode tests
        env:
          FORMA_DEV_MODE: "true"
          DATABASE_BACKEND: "sqlite"
        run: >-
          python -m pytest -q
          tests/projects/test_generation_mode_requests.py
          tests/projects/test_hierarchical_cad.py
          tests/projects/test_hierarchical_visuals.py
          tests/agents/test_cost_aware_pipeline.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint mode-routing UI
        working-directory: apps/web
        run: npx eslint app/forma-workspace.tsx app/forma-workspace/home-chat-view.tsx

      - name: Commit routed modes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No routing changes to commit."
            exit 0
          fi
          git commit -m "feat: route regular and progressive generation modes"
          git push origin HEAD:${GITHUB_REF_NAME}
