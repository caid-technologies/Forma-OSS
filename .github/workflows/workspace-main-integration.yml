name: Integrate main-based chat workspace

on:
  push:
    branches: [feat/chat-project-workspace-main]
    paths:
      - .workbench/port-chat-workspace-main.py
      - .github/workflows/workspace-main-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'caid-technologies/Forma-OSS' && github.ref == 'refs/heads/feat/chat-project-workspace-main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch immutable source and main base
        run: |
          git fetch --no-tags origin e20037ba38c06f60a55d89b451855e2027ac9d32 ccd6d67b02968259b38f6a585e9d9366bcc5c3f0
          git fetch --deepen=10 origin feat/chat-project-workspace-main
      - name: Integrate only selected UI and test files
        run: python .workbench/port-chat-workspace-main.py
      - name: Commit actual source to the feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/chat-project-workspace-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/forma-workspace.tsx apps/web/app/forma-workspace/home-chat-view.tsx apps/web/app/forma-workspace/conversation-message-list.tsx apps/web/app/forma-workspace/cad-model-panel.tsx apps/web/app/forma-workspace/chat-project-layout.tsx apps/web/app/forma-workspace/chat-project-layout.module.css apps/web/lib/chat-project-layout.ts apps/web/test/chat-project-layout.test.ts apps/web/test/chat-project-integration.test.ts apps/web/e2e/chat-project-workspace.spec.mjs apps/web/playwright.workspace.config.mjs apps/web/test/fixtures/chat-project-workspace.tsx apps/web/test/fixtures/chat-project-workspace.css apps/web/test/serve-chat-project-fixture.mjs docs/chat-project-workspace.md
          git diff --cached --check
          git commit -m 'feat(web): shared project workspace and lightweight chat cards on main'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/chat-project-workspace-main
          git log -1 --format='%H %s'
