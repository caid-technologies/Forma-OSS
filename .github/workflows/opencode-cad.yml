name: OpenCode STEP and conversation context

on:
  pull_request:
    paths:
      - "apps/api/opencode*"
      - "apps/api/readiness_api.py"
      - "apps/api/Dockerfile"
      - "forma_core/opencode/**"
      - "forma_core/workspaces/projects/**"
      - "tests/opencode/**"
      - "tests/projects/test_*cad*.py"
      - "tests/projects/test_demo_printer_exports.py"
      - "tests/projects/inspect_native_step.py"
      - ".agents/skills/forma-hardware/scripts/cad.py"
      - ".github/workflows/opencode-cad.yml"

permissions:
  contents: read

jobs:
  native-cad:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      FORMA_CAD_RUN_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/api/requirements.txt pytest "opencad[occt]==0.2.3"
      - run: python .agents/skills/forma-hardware/scripts/cad.py check
      - run: python -m pytest tests/opencode tests/projects/test_cad_generation.py tests/projects/test_solid_cad.py tests/projects/test_demo_printer_exports.py -q
