name: Integrate main workspace regression tests
on:
  push:
    branches: [feat/chat-project-workspace-main]
    paths: [.workbench/port-chat-workspace-main.py, .github/workflows/workspace-main-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'caid-technologies/Forma-OSS' && github.ref == 'refs/heads/feat/chat-project-workspace-main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - run: python .workbench/port-chat-workspace-main.py
      - name: Commit tests to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/chat-project-workspace-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/forma-workspace.tsx apps/web/e2e/opencode-chat.spec.ts
          git diff --cached --check
          git commit -m 'test(web): exercise shared workspace on the real OpenCode page'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/chat-project-workspace-main
