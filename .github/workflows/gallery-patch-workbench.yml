name: Temporary gallery patch workbench

on:
  push:
    branches: [perf/projects-gallery-20260915]
    paths: [.github/workflows/gallery-patch-workbench.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/perf/projects-gallery-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed source changes
        run: |
          python .github/gallery-backend-patch.py
          python .github/gallery-frontend-patch.py
          python .github/gallery-tests-patch.py
          python - <<'PY'
          import subprocess
          expected = {
            'apps/web/app/forma-workspace.tsx': '4552a19091e2f57c40d35dce658dce94d9421510',
            'apps/api/main.py': '78fcb4bcb05d6ae005f29851feeee3618e68fec9',
            'forma_core/project_list_cache.py': 'a6ab6e12344c4adb119ce1fb60fd3f185cb98a54',
            'tests/api/test_project_access.py': 'c588ce634eeb57050409212f32d52c11301ebda4',
            'tests/api/test_project_list_cache.py': '22776a31911903aab3181a3b02ba85cfe6c9e70d',
            'apps/web/e2e/project-pagination.spec.ts': '61d1008feff9a5edd5937f0cec6679ff96aae8d0',
            'apps/web/lib/gallery-loading.ts': '8e4a7d5536e18d4205266186b594ef8714e1ae56',
            'apps/web/test/gallery-loading.test.ts': '7fb7f3747c6d45e255ff0ce4e168463946311ae0',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          print('All eight source files match the locally reviewed patch.')
          PY
          git diff --check
      - run: python -m pip install pydantic python-dotenv
      - run: python -m unittest tests.api.test_project_list_cache -v
      - run: node --experimental-strip-types --test apps/web/test/gallery-loading.test.ts
      - name: Commit only source and tests to the feature branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/main.py apps/web/app/forma-workspace.tsx apps/web/e2e/project-pagination.spec.ts forma_core/project_list_cache.py tests/api/test_project_access.py tests/api/test_project_list_cache.py
          git rm .github/gallery-backend-patch.py .github/gallery-frontend-patch.py .github/gallery-tests-patch.py
          git commit -m 'perf: cache paginated projects and load gallery images independently'
          git push origin HEAD:refs/heads/perf/projects-gallery-20260915
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  backend:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt pytest
      - run: python -m pytest tests/api/test_project_list_cache.py tests/api/test_project_access.py tests/api/test_project_engagement.py -q
  web:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FORMA_AUTH_MODE: local
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Typecheck
        id: types
        continue-on-error: true
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
        working-directory: apps/web
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Gallery browser regressions
        id: browser
        continue-on-error: true
        run: npx playwright test e2e/project-pagination.spec.ts --workers=1 --reporter=list
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-results
          path: apps/web/test-results
          retention-days: 1
      - name: Require successful checks
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          printf 'Types=%s Lint=%s Build=%s Browser=%s\n' "$TYPES" "$LINT" "$BUILD" "$BROWSER"
          test "$TYPES" = success && test "$LINT" = success && test "$BUILD" = success && test "$BROWSER" = success
